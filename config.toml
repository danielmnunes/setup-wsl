min_version = "2026.9.0"

[settings]
idiomatic_version_file_enable_tools = ["bun", "go", "java", "node"]

[env]
# Go fica no toolchain do mise. Projetos ainda podem pedir outra versão
# com a diretiva toolchain do go.mod.
GOTOOLCHAIN = "local"
PYTHON_VERSION = "3.14"

[vars]
# config_root da config global é $HOME. Este caminho segue o symlink
# ~/.config/mise até o clone, e as tasks enxergam vars (não config_source).
setup_root = "{{ config_source | canonicalize | dirname }}"

[bootstrap.mise_shell_activate]
# Sem ~/.bash_profile: no Ubuntu ele esconde o ~/.profile, que é quem
# coloca ~/.local/bin no PATH.
# O ~/.zshrc e o ~/.zprofile vêm de zsh/ e o install.sh copia os dois.
bashrc = "activate"
zshrc = false

[bootstrap.hooks]
# config_root da config global é $HOME, não este repositório.
# canonicalize segue o symlink ~/.config/mise -> este clone.
pre-packages = "bash \"{{ vars.setup_root }}/scripts/apt-git-ppa.sh\""

[dotfiles]
"~/.gitconfig/delta" = { block = """
[core]
    pager = delta
[interactive]
    diffFilter = delta --color-only
[delta]
    navigate = true
    line-numbers = true
""" }

[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:unzip" = "latest"
"apt:gnupg" = "latest"
"apt:software-properties-common" = "latest"
"apt:git" = "latest"
"apt:build-essential" = "latest"
"apt:pkg-config" = "latest"

[tools]
java = "temurin-25"
go = "1.26"
node = "24"
bun = "1.4"
uv = "latest"
glab = "latest"
ripgrep = "latest"
fd = "latest"
jq = "latest"
bat = "latest"
eza = "latest"
delta = "latest"
fzf = "latest"
zoxide = "latest"

[tasks.bootstrap]
description = "Instala o Python padrão com uv e confere as ferramentas"
dir = "{{ vars.setup_root }}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
bash scripts/install-python.sh
bash scripts/check.sh
'''

[tasks.check]
description = "Mostra as versões instaladas por este setup"
dir = "{{ vars.setup_root }}"
run = "bash scripts/check.sh"
